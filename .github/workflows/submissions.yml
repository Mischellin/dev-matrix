name: Check submissions

on:
  pull_request:
    paths:
      - "submissions/**"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Только файлы в submissions/
        run: |
          git fetch -q origin "${{ github.base_ref }}"
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -v '^submissions/'; then
            echo "PR с результатами не должен менять ничего, кроме submissions/"; exit 1
          fi
      - name: Проверка отчётов
        run: PYTHONPATH=src python -m devmatrix.cli check-submissions submissions
