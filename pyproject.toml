[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dev-matrix"
version = "0.2.0"
description = "DevMatrix: публичный бенчмарк ИИ-агентов для разработки и CLI для своих прогонов"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

[project.scripts]
devmatrix = "devmatrix.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/devmatrix"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel.force-include]
"scripts/runner.py" = "devmatrix/runner.py"
"scripts/pytest_guard.py" = "devmatrix/pytest_guard.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["tasks", ".*", "build", "dist"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["scripts/export_metrics.py"]
