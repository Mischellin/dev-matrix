[project]
name = "dev-matrix"
version = "0.1.0"
description = "Public Benchmark Matrix & Anonymized Task Suite"
readme = "README.md"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["tasks", ".*", "build", "dist"]

[tool.ruff]
line-length = 100
target-version = "py311"
