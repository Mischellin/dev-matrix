# Пресеты моделей для bench.sh. Только модели, которые помещаются на ОДНУ карту (без tensor parallel).
# Значения сверены 2026-11-13 с карточками на huggingface.co (README, config.json), списком файлов репозиториев через HF API
# и исходниками vLLM v0.33.0 (fp8.py, docs/features/quantization/online.md, model_loader/default_loader.py).
#
# Поля:
#   hf_id               — репозиторий Hugging Face
#   served_name         — имя для vLLM (--served-model-name) и для devmatrix --model; квантование зашито в имя
#   max_model_len       — --max-model-len; задачи небольшие, длиннее 64k агенту не нужно
#   gpu_memory_utilization — --gpu-memory-utilization
#   min_gpu_gb          — сколько видеопамяти нужно (веса + KV-кэш на max_model_len); ориентир, не измерение
#   dtype               — --dtype
#   quantization        — --quantization (необязательно); для готовых FP8/MXFP4 чекпойнтов не нужно; для онлайн-квантования
#                         BF16 — fp8_per_tensor (в v0.33.0 `fp8` онлайн-квантование не поддерживает, fp8.py поднимает ValueError)
#   tool_call_parser    — --tool-call-parser (вместе с --enable-auto-tool-choice)
#   reasoning_parser    — --reasoning-parser (необязательно)
#   extra_args          — прочие флаги vllm serve
#   download_exclude    — маски файлов репозитория, которые не качаем (дубликаты весов в других форматах); качаем ровно то,
#                         что загрузит vLLM
#   interleaved_field   — поле с рассуждениями для провайдера OpenCode (необязательно)
#   notes               — что проверено и что нет
#
# Имена парсеров найдены в vllm/tool_parsers/__init__.py и vllm/reasoning/__init__.py тега v0.33.0.
# «Из карточки» — команда взята из README модели; «по аналогии» — в карточке парсер не указан.

[models.gpt-oss-20b]
hf_id = "openai/gpt-oss-20b"
served_name = "gpt-oss-20b"
max_model_len = 65536
gpu_memory_utilization = 0.90
min_gpu_gb = 24
dtype = "auto"
tool_call_parser = "openai"
reasoning_parser = "openai_gptoss"
extra_args = []
download_exclude = ["original/*", "metal/*"]
notes = """MXFP4 из коробки (quant_method=mxfp4 в config.json), веса ~14 ГБ; в репозитории ещё original/ и metal/ — не качаем (весь репозиторий 41 ГБ). \
Парсеры openai/openai_gptoss есть в v0.33.0, но в карточке модели указана только команда `vllm serve openai/gpt-oss-20b`, поэтому связка парсеров НЕ проверена запуском. \
Нативная Mxfp4-ядра быстрее на Hopper/Blackwell; на Ampere/Ada vLLM может падать на запасной путь."""

[models.devstral-small-2]
hf_id = "mistralai/Devstral-Small-2-24B-Instruct-2512"
served_name = "devstral-small-2-24b-fp8"
max_model_len = 65536
gpu_memory_utilization = 0.90
min_gpu_gb = 48
dtype = "auto"
tool_call_parser = "mistral"
extra_args = []
download_exclude = ["model-*.safetensors", "model.safetensors.index.json"]
notes = """FP8-чекпойнт (quant_method=fp8), веса ~25 ГБ. Из карточки: --tool-call-parser mistral --enable-auto-tool-choice (карточка даёт tensor-parallel 2 и 262144, здесь одна карта и 65536). \
Модель не reasoning — reasoning_parser не задан. В репозитории два набора весов: consolidated-*.safetensors (формат Mistral) и model-*.safetensors (HF); список файлов проверен через HF API. \
default_loader vLLM v0.33.0 при load_format=auto выбирает mistral, если есть consolidated*.safetensors (и грузит только их), а params.json и tekken.json в auto-режиме предпочитаются config.json и токенизатору HF (config.py, tokenizers/registry.py). \
Поэтому качаем consolidated*, params.json, tekken.json и прочие файлы, а model-*.safetensors (дубль весов, которого vLLM не загрузит) исключаем. Запуском эта связка НЕ проверена."""

[models.qwen3-8-27b]
hf_id = "Qwen/Qwen3.8-27B-FP8"
served_name = "qwen3.8-27b-fp8"
max_model_len = 65536
gpu_memory_utilization = 0.90
min_gpu_gb = 48
dtype = "auto"
tool_call_parser = "qwen3_coder"
reasoning_parser = "qwen3"
extra_args = ["--max-num-seqs", "32"]
download_exclude = []
notes = """Dense, FP8 (quant_method=fp8), веса ~31 ГБ по размеру файлов; архитектура Qwen3_5ForConditionalGeneration (есть в реестре vLLM v0.33.0). \
Парсеры qwen3_coder + qwen3 — ПО АНАЛОГИИ с Kwaipilot/KAT-Coder-V2.5-Dev (тот же qwen3_5): в карточке Qwen3.8 команды vllm serve с парсерами нет, не проверено. \
Мультимодальная модель; для текстовых задач можно добавить extra_args = ["--language-model-only"] (флаг есть в v0.33.0), не проверено на этом чекпойнте. \
--max-num-seqs 32: без него vLLM падал с «max_num_seqs (256) exceeds available Mamba cache blocks (226)»; агент гоняет задачи по одной, 32 одновременных запросов с запасом. \
Проверено: с этим флагом vLLM поднялся на RTX A6000 48 ГБ; прогон задач до конца НЕ выполнялся."""

[models.north-mini-code]
hf_id = "CohereLabs/North-Mini-Code-1.0-fp8"
served_name = "north-mini-code-1.0-fp8"
max_model_len = 65536
gpu_memory_utilization = 0.90
min_gpu_gb = 40
dtype = "auto"
tool_call_parser = "cohere_command4"
reasoning_parser = "cohere_command4"
extra_args = []
download_exclude = []
interleaved_field = "reasoning"
notes = """ОФИЦИАЛЬНЫЙ FP8-чекпойнт Cohere (compressed-tensors, float-quantized: веса FP8 по каналам, активации динамически по токенам), 30B-A3B MoE, лицензия Apache 2.0. \
Проверено по HF API и карточке 2026-11-13: 7 файлов model-*.safetensors, всего ~32 ГБ (с токенизатором), онлайн-квантование не нужно, поэтому `--quantization` не задан (vLLM берёт схему из quantization_config). \
Из карточки: --tool-call-parser cohere_command4 --reasoning-parser cohere_command4 --enable-auto-tool-choice --moe-backend triton (флаг --moe-backend triton здесь НЕ используется, см. ниже; карточка даёт -tp 1 и --max-model-len 320000, здесь 65536). \
Карточка просит vLLM main «до выхода релиза», а точный тег не называет; в исходниках v0.33.0 есть Cohere2MoeForCausalLM (registry.py, models/cohere2_moe.py), парсеры cohere_command4 (tool_parsers и reasoning), флаг --moe-backend и CompressedTensorsW8A8Fp8MoEMethod (compressed_tensors_moe.py), \
то есть загрузка compressed-tensors FP8 для cohere2_moe по коду возможна, но запуском НЕ проверена. Парсеры работают через пакет cohere_melody>=0.9.0 (карточка: `uv pip install cohere_melody>=0.9.0`): в Dockerfile он не установлен — НЕ проверено, что он есть в образе vllm/vllm-openai:v0.33.0. \
min_gpu_gb = 40 — ОЦЕНКА, не измерение: веса ~32 ГБ + KV-кэш на 65536 токенов. Полное внимание только в 13 из 49 слоёв (остальные — скользящее окно 4096), 4 KV-головы по 128 → ~26 КБ на токен в BF16, ~1,7 ГБ на 65536 токенов; даже если vLLM выделит кэш скользящих слоёв без экономии, это ещё до ~5 ГБ. \
С запасом на активации и граф CUDA выходит около 40 ГБ; на карте 40 ГБ при gpu_memory_utilization 0.90 (36 ГБ) впритык — при нехватке снизьте max_model_len или возьмите 48 ГБ. \
Карточка просит для OpenCode конфиг с interleaved.field = reasoning и ветку main OpenCode «до выхода релиза» — на закреплённой версии это НЕ проверено. \
--moe-backend triton из карточки убран: на Ampere (RTX A6000) vLLM падал с «FP8 MoE backend TRITON does not support ... W8A8 per-channel». Проверено: без флага vLLM поднялся на RTX A6000 48 ГБ (Ampere). \
Как ведут себя Ada/Hopper с флагом из карточки — НЕ проверено."""

[models.kat-coder-v2-5-dev]
hf_id = "Kwaipilot/KAT-Coder-V2.5-Dev"
served_name = "kat-coder-v2.5-dev-fp8-online"
max_model_len = 65536
gpu_memory_utilization = 0.90
min_gpu_gb = 80
dtype = "bfloat16"
quantization = "fp8_per_tensor"
tool_call_parser = "qwen3_coder"
reasoning_parser = "qwen3"
extra_args = ["--language-model-only"]
download_exclude = []
notes = """35B MoE (qwen3_5_moe), чекпойнт BF16 69 ГБ: на одну карту <80 ГБ — онлайн-квантование `--quantization fp8_per_tensor` (результаты — FP8 от vLLM; почему per_tensor, а не `fp8`: в v0.33.0 `fp8` для BF16 падает, fp8.py — «no longer supports online quantization»). \
Официального FP8/AWQ-чекпойнта от Kwaipilot нет (поиск по HF 2026-11-13); есть только сторонние (GGUF, MLX, а также неофициальные FP8/AWQ/NVFP4, например debackerl/KAT-Coder-V2.5-Dev-FP8, cyankiwi/KAT-Coder-V2.5-Dev-AWQ-INT4) — их не берём: не от автора, качество и совместимость с vLLM не проверялись. Поэтому онлайн-квантование из официального BF16. \
Это единственный пресет, которому нужна карта 80 ГБ; для дешёвых прогонов его можно пропустить. \
min_gpu_gb = 80: BF16 69 ГБ может целиком лечь в видеопамять до сжатия (послойную загрузку документация не обещает), поэтому карта 80 ГБ — минимум, и это впритык: НЕ проверено, что хватит; при нехватке — карта 96+ ГБ. \
Из карточки: --reasoning-parser qwen3 --tool-call-parser qwen3_coder --enable-auto-tool-choice и обязательный --language-model-only (в чекпойнте нет весов vision-башни); карточка даёт tensor-parallel 8 и 262144. \
Карточка рекомендует vllm>=0.19.0."""
